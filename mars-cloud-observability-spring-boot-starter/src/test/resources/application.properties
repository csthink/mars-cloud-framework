# 测试默认用文本格式的控制台日志：构建校验器按「级别 类名 消息」的文本形态识别告警，
# 结构化 JSON 行不匹配它的模式，会让测试里的告警在构建报告里消失。
# 结构化日志本身由 StructuredLoggingTest 单独打开 ecs 验证。
mars.observability.logging.console-format=plain

# 服务发现组件是可选依赖，但它在本模块的测试 classpath 上会尝试注册到注册中心。
# 单元测试不连注册中心；管理端口写入实例元数据的行为由 ManagementPortMetadataTest 直接驱动。
spring.cloud.nacos.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
