name: CI

# 基础检查：编译（含测试源码，不运行测试）、验证工具单元测试、本仓红线扫描。
# 全量构建、全部测试与使用方兼容性构建由 tools/verify.sh 在推送前完成，见 docs/ci.md。

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Compile and scan sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout framework
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Install Corretto
        id: java
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Install Maven
        id: maven
        run: |
          bash tools/install-maven.sh "$RUNNER_TEMP/maven"
          echo "$RUNNER_TEMP/maven/apache-maven-3.9.14/bin" >> "$GITHUB_PATH"

      - name: Test verification tools
        id: tools
        run: python3 -m unittest discover -s tools/tests -v

      # -DskipTests 仍编译测试源码，只是不运行；不用 -Dmaven.test.skip。
      - name: Compile sources
        id: compile
        run: mvn -B -ntp -DskipTests verify

      - name: Scan public sources
        id: scan
        run: bash tools/check-public-safety-generic.sh .

      - name: Require every check step
        if: always()
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          steps = json.loads(os.environ['OUTCOMES'])
          required = ('checkout', 'java', 'maven', 'tools', 'compile', 'scan')
          failed = [name for name in required if steps.get(name, {}).get('outcome') != 'success']
          if failed:
              raise SystemExit('Required steps did not succeed: ' + ', '.join(failed))
          PYCODE

  summary:
    name: 编译 + 安全扫描
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success
